name: GPU Price Tracker

on:
  schedule:
    - cron: '0 8 * * *' # Зберігає розклад щодня о 08:00 UTC (11:00 за Києвом)
  workflow_dispatch: # Дозволяє запускати вручну з кнопки

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run price tracker script
        run: python gpu_tracker_bot.py

      - name: Commit and push changes if prices updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add prices_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update price history [skip ci]" && git push)
